    <title>AppleSheep · 记录 / 实践 / 复盘</title>
    <script type="text/javascript">
      ;(function (l) {
        if (l.search && l.search.startsWith('?/')) {
          const decoded = l.search.slice(2).split('&').map(s => s.replace(/~and~/g, '&')).join('&')
          const newUrl = l.pathname.replace(/\/index\.html$/, '/') + decoded + l.hash
          window.history.replaceState(null, '', newUrl)
        }
      })(window.location)
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
