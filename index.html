<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="AppleSheep 的个人技术知识库，记录前端、后端、数据库、项目与部署实践。" />
    <title>AppleSheep · 技术知识花园</title>
    <script type="text/javascript">
      ;(function (l) {
        if (l.search && l.search.startsWith('?/')) {
          const decoded = l.search.slice(2).split('&').map(s => s.replace(/~and~/g, '&')).join('&')
          const newUrl = l.pathname.replace(/\/index\.html$/, '/') + decoded + l.hash
          window.history.replaceState(null, '', newUrl)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
